stages:
  - lint
  - test
  - validate
  - train
  - build
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

default:
  tags:
    - local
  before_script:
    - if (Test-Path .\venv\Scripts\python.exe) { $env:Path = "$PWD\venv\Scripts;" + $env:Path }
    - $env:PYTHONUTF8 = "1"

lint:
  stage: lint
  script:
    - python -m pip install -q ruff
    - ruff check app src tests scripts --select E,F --ignore E501,E402

test:
  stage: test
  script:
    - python -m pip install -q -r requirements.txt pytest fastapi uvicorn
    - pytest tests/ -v --tb=short --junitxml=report.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml
    paths:
      - report.xml

validate-config:
  stage: validate
  script:
    - python -m pip install -q pyyaml
    - python scripts/validate_config.py

train:
  stage: train
  script:
    - python -m pip install -q -r requirements.txt
    - python scripts/continuous_train.py
  artifacts:
    when: on_success
    expire_in: 1 week
    paths:
      - models/*.pkl
      - reports/evaluation.json
  rules:
    - changes:
        - src/**/*
        - configs/params.yaml
        - configs/thresholds.yaml
        - data/**/*
        - dvc.yaml
        - scripts/continuous_train.py
        - scripts/validate_model.py
    - if: $CI_PIPELINE_SOURCE == "web"

docker-build:
  stage: build
  script:
    - docker build -t house-price-api:${CI_COMMIT_SHORT_SHA} -t house-price-api:latest .
    - docker run --rm house-price-api:latest python -c "import app.main"

deploy-local:
  stage: deploy
  script:
    - $env:MODEL_VERSION = "${CI_COMMIT_SHORT_SHA}"
    - docker compose up -d --build --force-recreate
    - Start-Sleep -Seconds 8
    - curl.exe -sf http://127.0.0.1:8000/health
    - curl.exe -sf http://127.0.0.1:8000/model-info
  environment:
    name: local
    url: http://127.0.0.1:8000/docs
