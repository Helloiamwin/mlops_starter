name: ci-cd-ct

on:
  push:
    branches:
      - session/06
  workflow_dispatch:

defaults:
  run:
    shell: powershell

env:
  PYTHONUTF8: "1"
  MLFLOW_TRACKING_URI: "http://localhost:5000"
  MLFLOW_DISABLE_AGENT_HINT: "1"
  PIP_CACHE_DIR: ${{ github.workspace }}\.pip-cache

jobs:
  lint:
    name: lint
    runs-on: [self-hosted, local]
    steps:
      - uses: actions/checkout@v4
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Setup
        run: |
          python -m pip install -q -r requirements.txt
          python -c "import ruff, dvc, mlflow, skops; print('deps ok')"
      - name: Lint
        run: python -m ruff check app src tests scripts --select E,F --ignore E501,E402

  test:
    name: test
    runs-on: [self-hosted, local]
    steps:
      - uses: actions/checkout@v4
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Setup
        run: |
          python -m pip install -q -r requirements.txt
          python scripts/ensure_raw.py
      - name: Test
        run: python -m pytest tests/ -v --tb=short --junitxml=report.xml

  validate:
    name: validate
    runs-on: [self-hosted, local]
    steps:
      - uses: actions/checkout@v4
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Setup
        run: python -m pip install -q -r requirements.txt
      - name: Validate config
        run: python scripts/validate_config.py

  train:
    name: train
    needs: [lint, test, validate]
    runs-on: [self-hosted, local]
    steps:
      - uses: actions/checkout@v4
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Setup
        run: |
          python -m pip install -q -r requirements.txt
          python -c "import dvc, mlflow, skops; print('deps ok')"
          python scripts/ensure_raw.py
          try { Invoke-WebRequest -Uri "$env:MLFLOW_TRACKING_URI/health" -UseBasicParsing -TimeoutSec 3 | Out-Null; Write-Host "mlflow ok" } catch { Write-Error "MLflow not reachable at $env:MLFLOW_TRACKING_URI — start: mlflow ui --port 5000"; exit 1 }
      - name: Data pipeline
        run: |
          python -m dvc init --force --no-scm
          python -m dvc repro
      - name: Pull model
        run: python scripts/pull_model.py --alias champion
      - name: Model quality gate
        run: python scripts/validate_model.py
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            models/
            reports/evaluation.json

  build:
    name: build
    needs: [train]
    runs-on: [self-hosted, local]
    steps:
      - uses: actions/checkout@v4
      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
      - name: Docker build
        run: |
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $env:IMAGE_TAG = $sha
          docker build -t "house-price-api:$sha" -t house-price-api:latest .
      - name: Smoke test
        run: |
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          docker run --rm "house-price-api:$sha" python -c "import app.main"

  deploy:
    name: deploy
    needs: [build]
    runs-on: [self-hosted, local]
    environment:
      name: local
      url: http://127.0.0.1:8000/docs
    steps:
      - uses: actions/checkout@v4
      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
      - name: Deploy
        run: |
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $manifest = Get-Content models/pull_manifest.json -Raw | ConvertFrom-Json
          $env:IMAGE_TAG = $sha
          $env:MODEL_VERSION = $manifest.version
          docker rm -f house-price-api 2>$null
          docker compose down --remove-orphans
          docker compose up -d --no-build --force-recreate --pull never
      - name: Health check
        run: |
          Start-Sleep -Seconds 8
          curl.exe -sf http://127.0.0.1:8000/health
          curl.exe -sf http://127.0.0.1:8000/model-info
