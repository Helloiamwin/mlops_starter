project:
  name: house-price-prediction
  version: "0.1.0"
  random_seed: 42

data:
  raw_path: data/raw/kc_house_data.csv
  processed_dir: data/processed
  test_size: 0.2
  val_size: 0.1

features:
  numeric:
    - area
    - bedrooms
    - bathrooms
    - age
    - floors
  categorical:
    - location
  target: price

preprocessing:
  scaler: StandardScaler
  encoder: LabelEncoder

training:
  model: GradientBoostingRegressor
  params:
    n_estimators: 200
    max_depth: 5
    learning_rate: 0.1
    random_state: 42
  experiment_name: house-price-prediction

mlflow:
  tracking_uri: http://localhost:5000
  experiment_name: house-price-prediction
  model_name: house-price-model
